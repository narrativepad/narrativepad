# Builds the escrow program (and the test-only pump stand-in) and runs its unit, property and
# LiteSVM tests on GitHub's machines, so nothing has to be installed locally.
# No deploys, no keys, no secrets. On main, a build that passed its tests is published as the
# `devnet-build` pre-release, which docs/DEPLOY.md deploys to devnet from the owner's machine.
name: Escrow program

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "tests/mock_pump/**"
      - "idls/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "scripts/test-program.sh"
      - ".github/workflows/program.yml"
  pull_request:
    paths:
      - "programs/**"
      - "tests/mock_pump/**"
      - "idls/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: program-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Anchor · LiteSVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Pinned to the versions in scripts/setup-wsl.sh (ARCHITECTURE.md §12.1).
      AGAVE_VERSION: v4.1.2
      ANCHOR_VERSION: 1.2.0
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libudev-dev llvm libclang-dev protobuf-compiler libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Cache Solana CLI and Anchor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.avm
          key: sol-${{ runner.os }}-${{ env.AGAVE_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Agave (Solana CLI)
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          command -v avm >/dev/null 2>&1 || cargo install --git https://github.com/otter-sec/anchor avm --force --locked
          avm install "${ANCHOR_VERSION}" || true
          avm use "${ANCHOR_VERSION}"

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      # anchor build reads the provider wallet from Anchor.toml. This throwaway key is never
      # funded or used to sign anything.
      - name: Throwaway build wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json >/dev/null

      - name: Build and test
        run: |
          set -o pipefail
          bash scripts/test-program.sh 2>&1 | tee build.log

      # Logs need a GitHub login to read; annotations are public. Surface the compiler errors and
      # the end of the output as annotations so failures are visible to everyone.
      - name: Report failures as annotations
        if: failure()
        run: |
          enc() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          errs=$(grep -n -A14 -E '^(error(\[E[0-9]+\])?:|thread .* panicked|test result: FAILED|failures:)' build.log | head -n 220 | enc)
          [ -n "$errs" ] && echo "::error title=Build/test errors::${errs}"
          echo "::error title=Last 80 lines::$(tail -n 80 build.log | enc)"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-escrow-build
          if-no-files-found: ignore
          path: |
            target/deploy/narrative_escrow.so
            target/idl/narrative_escrow.json
            target/types/narrative_escrow.ts
            Cargo.lock

  # Artifacts need a GitHub login to download; a release doesn't. Only this job can write, and it
  # only replaces the `devnet-build` pre-release with the build that just passed.
  publish-devnet-build:
    name: Publish devnet build
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: narrative-escrow-build
          path: build
      - name: Replace the devnet-build release
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp target/deploy/narrative_escrow.so target/idl/narrative_escrow.json .
          sha256sum narrative_escrow.so | tee narrative_escrow.so.sha256
          gh release delete devnet-build --cleanup-tag --yes || true
          gh release create devnet-build narrative_escrow.so narrative_escrow.json narrative_escrow.so.sha256 \
            --target "$GITHUB_SHA" --prerelease --title "Devnet build" \
            --notes "Escrow program built and tested by CI from ${GITHUB_SHA}. Devnet only. Mainnet needs an external audit first (CLAUDE.md)."
