[package]
name = "narrative_escrow"
version = "0.1.0"
description = "Narrativepad: non-custodial community pool escrow that launches a pump.fun coin"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "narrative_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = "0.17"
proptest = "1"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
solana-account = "4"
solana-clock = "3"
solana-transaction-error = "3"
serde_json = "1"
